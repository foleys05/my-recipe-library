let recipes=[],mode='All';const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const get=id=>{try{return JSON.parse(localStorage.getItem('rec_'+id)||'{}')}catch{return {}}};const save=(id,k,v)=>{let o=get(id);o[k]=v;try{localStorage.setItem('rec_'+id,JSON.stringify(o))}catch{}};const ease=['','Very easy','Easy','Involved'];const effort=['','Low','Medium','High'];function filters(){let options=['All','Weeknight','Weekend project','Quick bite','Favorites','Want to try'];$('chips').innerHTML=options.map(x=>`<button class="chip ${x===mode?'active':''}" data-filter="${safe(x)}">${safe(x)}</button>`).join('');$('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.filter;filters();render()})}function render(){let q=$('search').value.trim().toLowerCase(),t=Number($('time').value),sort=$('sort').value;let a=recipes.filter(r=>(!t||r.time<=t)&&(!q||[r.title,r.category,r.tags,r.source,...r.ingredients,...r.steps].join(' ').toLowerCase().includes(q))&&(mode==='All'||(mode==='Favorites'?get(r.id).status==='Favorite':mode==='Want to try'?(get(r.id).status||r.status)==='Want to try':r.occasion===mode)));a.sort((a,b)=>sort==='name'?a.title.localeCompare(b.title):sort==='effort'?a.effort-b.effort||a.time-b.time:sort==='ease'?a.ease-b.ease||a.time-b.time:sort==='protein'?(b.nutrition?.protein_g||0)-(a.nutrition?.protein_g||0):sort==='calories'?(a.nutrition?.calories||0)-(b.nutrition?.calories||0):a.time-b.time);$('count').textContent=a.length+' recipe'+(a.length===1?'':'s');$('cards').innerHTML=a.map(r=>`<button class="card" data-id="${safe(r.id)}"><img src="${r.photo}" alt="Original photographed recipe" loading="lazy"><div class="cb"><div class="tag">${safe(r.occasion)}</div><h2>${safe(r.title)}</h2><div class="pills"><span>⏱ ${r.time} min</span><span>${ease[r.ease]}</span><span>${effort[r.effort]} effort</span></div><div class="cardmacro">${r.nutrition?.calories ?? "—"} kcal · ${r.nutrition?.protein_g ?? "—"}g protein / serving</div></div></button>`).join('')||'<div class="empty">No matches. Try another ingredient or filter.</div>';$('cards').querySelectorAll('button').forEach(b=>b.onclick=()=>openRecipe(b.dataset.id))}function openRecipe(id){let r=recipes.find(r=>r.id===id),s=get(id);$('sheet').innerHTML=`<div class="sheethead"><div class="top"><span class="eyebrow">${safe(r.occasion)} · ${r.time} minutes</span><button class="close" id="close" aria-label="Close recipe">×</button></div><h2>${safe(r.title)}</h2><div class="sub">${safe(r.servings)} servings · ${safe(r.cal)} calories · ${safe(r.protein)}g protein per serving</div><div class="pills"><span>${ease[r.ease]}</span><span>${effort[r.effort]} effort</span><span>${r.active} min active</span></div></div><div class="body"><div class="actions"><button id="fav">${s.status==='Favorite'?'★ Favorite':'☆ Favorite'}</button><button id="tried">Mark tried</button><button id="want">Want to try</button><button onclick="window.print()">Print</button></div><div class="muted">Status: ${safe(s.status||r.status)}</div><h3>Nutrition per serving</h3><div class="macros">${[["Calories",r.nutrition?.calories,"kcal"],["Protein",r.nutrition?.protein_g,"g"],["Carbs",r.nutrition?.carbs_g,"g"],["Fat",r.nutrition?.fat_g,"g"]].map(([label,value,unit])=>`<div class="macro"><strong>${value == null ? "—" : value}</strong><small>${label}${value == null ? "" : " ("+unit+")"}</small></div>`).join("")}</div><p class="muted">${r.nutrition?.calories == null ? "Nutrition not provided in the photographed recipe; macros are pending calculation." : "Values are per serving, transcribed from the published nutrition panels where available."}</p><p class="muted">Fiber: ${r.nutrition?.fiber_g ?? "—"}g · Sodium: ${r.nutrition?.sodium_mg ?? "—"}mg per serving</p>${r.notes ? `<p class="muted"><strong>Recipe note:</strong> ${safe(r.notes)}</p>` : ""}<h3>Ingredients</h3><ul>${r.ingredients.map(x=>`<li>${safe(x)}</li>`).join('')}</ul><h3>Directions</h3><ol>${r.steps.map(x=>`<li>${safe(x)}</li>`).join('')}</ol><h3>My notes</h3><textarea class="note" id="note" placeholder="What worked? What would you change?">${safe(s.note||'')}</textarea><p class="muted">Notes save automatically in this browser.</p><h3>Original source</h3><p class="muted">${safe(r.source)} ${r.page?'· page '+safe(r.page):''}. Directions have been condensed from your photo; consult the image below to verify exact original wording.</p><img class="original" src="${r.photo}" alt="Original photographed magazine page"></div>`;$('modal').classList.add('open');document.body.style.overflow='hidden';$('close').onclick=closeRecipe;$('fav').onclick=()=>{save(id,'status','Favorite');openRecipe(id);render()};$('tried').onclick=()=>{save(id,'status','Tried');openRecipe(id);render()};$('want').onclick=()=>{save(id,'status','Want to try');openRecipe(id);render()};$('note').oninput=e=>save(id,'note',e.target.value)}function closeRecipe(){$('modal').classList.remove('open');document.body.style.overflow='';render()}$('modal').onclick=e=>{if(e.target===$('modal'))closeRecipe()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRecipe()});['search','time','sort'].forEach(id=>$(id).addEventListener('input',render));fetch('recipes.json?v=20261101-design', {cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Could not load recipes');return r.json()}).then(data=>{recipes=data;filters();render()}).catch(()=>{$('count').textContent='Unable to load recipes. Open this site through its GitHub Pages address.'});
</script></body></html>
