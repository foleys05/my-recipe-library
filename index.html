<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#244839"><title>My Recipe Library</title><style>
:root{--green:#244839;--cream:#f8f7f2;--line:#dcded5;--muted:#64736b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#26352e;font:16px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}header{padding:24px 18px 17px;background:#e7ebdf}header>div,main{max-width:1060px;margin:auto}h1{font:700 clamp(30px,6vw,47px) Georgia,serif;margin:3px 0 5px}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--green);font-weight:700}.sub{color:var(--muted);font-size:14px}main{padding:18px}input,select,button,textarea{font:inherit}input,select{background:#fff;border:1px solid #c7cfc6;border-radius:12px;padding:12px;width:100%;min-width:0;color:#26352e}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px}.chips{display:flex;overflow-x:auto;gap:8px;padding:14px 0 17px}.chip{white-space:nowrap;background:white;border:1px solid var(--line);border-radius:25px;padding:8px 13px;cursor:pointer}.chip.active{background:var(--green);color:white}.count{font-size:13px;color:var(--muted);margin-bottom:12px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden;text-align:left;cursor:pointer;padding:0;color:inherit}.card img{width:100%;height:165px;object-fit:cover;object-position:25% 45%}.cb{padding:14px}.tag{font-size:11px;font-weight:700;color:#41654c;text-transform:uppercase;letter-spacing:.04em}.card h2{font:23px/1.17 Georgia,serif;margin:7px 0 10px}.pills{display:flex;flex-wrap:wrap;gap:5px}.pills span{font-size:12px;background:#f0f2ed;border-radius:6px;padding:5px 7px}.modal{display:none;position:fixed;inset:0;background:#18281dcc;z-index:5;overflow-y:auto;padding:12px}.modal.open{display:block}.sheet{max-width:760px;margin:0 auto;background:var(--cream);border-radius:17px;overflow:hidden;min-height:85vh}.sheethead{padding:20px;background:#e7ebdf}.sheethead h2{font:34px/1.15 Georgia,serif;margin:8px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{background:white;border:1px solid var(--line);border-radius:50%;font-size:25px;width:42px;height:42px;cursor:pointer}.body{padding:18px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.actions button{border:1px solid #9baa9b;background:white;border-radius:10px;padding:8px 12px}.body h3{font:25px Georgia,serif;margin:20px 0 10px}.body li{margin-bottom:10px}.body ul,.body ol{padding-left:23px}.note{width:100%;min-height:80px;border:1px solid var(--line);border-radius:9px;padding:10px}.original{width:100%;max-width:600px;border-radius:10px}.muted{color:var(--muted);font-size:13px}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:600px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.cards{grid-template-columns:1fr 1fr;gap:9px}.card img{height:115px}.cb{padding:10px}.card h2{font-size:18px}.pills span{font-size:11px}.sheethead h2{font-size:28px}}@media(max-width:360px){.cards{grid-template-columns:1fr}}@media print{header,main,.actions,.close{display:none!important}.modal{position:static;display:block;background:white;padding:0}.sheet{min-height:0}.original{max-width:300px}}
</style></head><body><header><div><div class="eyebrow">Your personal collection</div><h1>My Recipe Library</h1><div class="sub">Find something good to cook, without digging through cookbooks.</div></div></header><main><div class="filters"><input id="search" type="search" placeholder="Search ingredients or recipes…" aria-label="Search ingredients or recipes"><select id="time" aria-label="Maximum time"><option value="">Any time</option><option value="20">≤ 20 min</option><option value="30">≤ 30 min</option><option value="45">≤ 45 min</option><option value="60">≤ 60 min</option></select><select id="sort" aria-label="Sort"><option value="time">Fastest</option><option value="effort">Least effort</option><option value="ease">Easiest</option><option value="name">A to Z</option></select></div><div class="chips" id="chips"></div><div class="count" id="count">Loading recipes…</div><div class="cards" id="cards"></div><p class="muted">Ease and effort are estimates. Favorites and notes are saved in this browser on this device, not synced between devices.</p></main><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div><script>
let recipes=[],mode='All';const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const get=id=>{try{return JSON.parse(localStorage.getItem('rec_'+id)||'{}')}catch{return {}}};const save=(id,k,v)=>{let o=get(id);o[k]=v;try{localStorage.setItem('rec_'+id,JSON.stringify(o))}catch{}};const ease=['','Very easy','Easy','Involved'];const effort=['','Low','Medium','High'];function filters(){let options=['All','Weeknight','Weekend project','Quick bite','Favorites','Want to try'];$('chips').innerHTML=options.map(x=>`<button class="chip ${x===mode?'active':''}" data-filter="${safe(x)}">${safe(x)}</button>`).join('');$('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.filter;filters();render()})}function render(){let q=$('search').value.trim().toLowerCase(),t=Number($('time').value),sort=$('sort').value;let a=recipes.filter(r=>(!t||r.time<=t)&&(!q||[r.title,r.category,r.tags,r.source,...r.ingredients,...r.steps].join(' ').toLowerCase().includes(q))&&(mode==='All'||(mode==='Favorites'?get(r.id).status==='Favorite':mode==='Want to try'?(get(r.id).status||r.status)==='Want to try':r.occasion===mode)));a.sort((a,b)=>sort==='name'?a.title.localeCompare(b.title):sort==='effort'?a.effort-b.effort||a.time-b.time:sort==='ease'?a.ease-b.ease||a.time-b.time:a.time-b.time);$('count').textContent=a.length+' recipe'+(a.length===1?'':'s');$('cards').innerHTML=a.map(r=>`<button class="card" data-id="${safe(r.id)}"><img src="${r.photo}" alt="Original photographed recipe" loading="lazy"><div class="cb"><div class="tag">${safe(r.occasion)}</div><h2>${safe(r.title)}</h2><div class="pills"><span>⏱ ${r.time} min</span><span>${ease[r.ease]}</span><span>${effort[r.effort]} effort</span></div></div></button>`).join('')||'<div class="empty">No matches. Try another ingredient or filter.</div>';$('cards').querySelectorAll('button').forEach(b=>b.onclick=()=>openRecipe(b.dataset.id))}function openRecipe(id){let r=recipes.find(r=>r.id===id),s=get(id);$('sheet').innerHTML=`<div class="sheethead"><div class="top"><span class="eyebrow">${safe(r.occasion)} · ${r.time} minutes</span><button class="close" id="close" aria-label="Close recipe">×</button></div><h2>${safe(r.title)}</h2><div class="sub">${safe(r.servings)} servings · ${safe(r.cal)} calories · ${safe(r.protein)}g protein per serving</div><div class="pills"><span>${ease[r.ease]}</span><span>${effort[r.effort]} effort</span><span>${r.active} min active</span></div></div><div class="body"><div class="actions"><button id="fav">${s.status==='Favorite'?'★ Favorite':'☆ Favorite'}</button><button id="tried">Mark tried</button><button id="want">Want to try</button><button onclick="window.print()">Print</button></div><div class="muted">Status: ${safe(s.status||r.status)}</div><h3>Ingredients</h3><ul>${r.ingredients.map(x=>`<li>${safe(x)}</li>`).join('')}</ul><h3>Directions</h3><ol>${r.steps.map(x=>`<li>${safe(x)}</li>`).join('')}</ol><h3>My notes</h3><textarea class="note" id="note" placeholder="What worked? What would you change?">${safe(s.note||'')}</textarea><p class="muted">Notes save automatically in this browser.</p><h3>Original source</h3><p class="muted">${safe(r.source)} ${r.page?'· page '+safe(r.page):''}. Directions have been condensed from your photo; consult the image below to verify exact original wording.</p><img class="original" src="${r.photo}" alt="Original photographed magazine page"></div>`;$('modal').classList.add('open');document.body.style.overflow='hidden';$('close').onclick=closeRecipe;$('fav').onclick=()=>{save(id,'status','Favorite');openRecipe(id);render()};$('tried').onclick=()=>{save(id,'status','Tried');openRecipe(id);render()};$('want').onclick=()=>{save(id,'status','Want to try');openRecipe(id);render()};$('note').oninput=e=>save(id,'note',e.target.value)}function closeRecipe(){$('modal').classList.remove('open');document.body.style.overflow='';render()}$('modal').onclick=e=>{if(e.target===$('modal'))closeRecipe()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRecipe()});['search','time','sort'].forEach(id=>$(id).addEventListener('input',render));fetch('recipes.json').then(r=>{if(!r.ok)throw Error('Could not load recipes');return r.json()}).then(data=>{recipes=data;filters();render()}).catch(()=>{$('count').textContent='Unable to load recipes. Open this site through its GitHub Pages address.'});
</script></body></html>
